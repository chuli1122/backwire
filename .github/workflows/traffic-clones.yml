name: Update clone statistics

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch daily clone counts
        id: traffic
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::notice::Skipping clone statistics: set TRAFFIC_TOKEN with Administration: read for this repository.'
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/traffic/clones?per=day" > "$RUNNER_TEMP/clones.json"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.traffic.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        if: steps.traffic.outputs.ready == 'true'
        with:
          ref: traffic-stats
          path: stats

      - name: Merge and publish changes to traffic-stats
        if: steps.traffic.outputs.ready == 'true'
        run: |
          python3 -I .github/scripts/update_clones.py "$RUNNER_TEMP/clones.json" stats
          cd stats
          git add -- clones.json badge.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update daily clone statistics'
          git push origin HEAD:traffic-stats
